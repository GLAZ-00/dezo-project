<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΔΕΖΩ.gr — Δεύτερη Ζωή στα πράγματα</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body, html {
    width: 100%;
    height: 100%;
    background-color: #6bb8c8;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Контейнер-оболочка, которая держит пропорции вашего скриншота */
  .site-container {
    width: 100%;
    max-width: 600px; /* Идеальная мобильная ширина под ваш скриншот */
    margin: 0 auto;
    position: relative;
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
  }

  /* Наш пуленепробиваемый визуальный слепок */
  .bg-screenshot {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none; /* Картинку нельзя случайно перетащить пальцем */
  }

  /* НЕВИДИМЫЕ ИΝΤΕΡАКТИВНЫЕ КЛИКАБЕЛЬНЫЕ ЗОНЫ (Ссылки поверх кружков) */
  .interactive-link {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    background: rgba(255, 255, 255, 0); /* Абсолютно прозрачные */
    transition: background 0.2s ease;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
  
  /* Легкий элитный отблеск при нажатии на кружок для сочности интерфейса */
  .interactive-link:active {
    background: rgba(255, 255, 255, 0.25);
  }

  /* ТОЧНЫЕ МАТЕМАТИЧЕСКИЕ КООРДИНАТЫ КРУГОВ (Выверены по пикселям вашего скриншота) */
  .lnk-electronics { top: 14.5%; left: 42.5%; width: 15.5%; padding-top: 15.5%; }
  .lnk-home        { top: 19.0%; left: 16.5%; width: 15.5%; padding-top: 15.5%; }
  .lnk-clothes     { top: 18.5%; left: 68.0%; width: 15.5%; padding-top: 15.5%; }
  .lnk-kids        { top: 35.5%; left: 4.5%;  width: 15.5%; padding-top: 15.5%; }
  .lnk-books       { top: 33.0%; left: 44.5%; width: 13.5%; padding-top: 13.5%; }
  .lnk-appliances  { top: 28.5%; left: 80.0%; width: 15.5%; padding-top: 15.5%; }
  .lnk-fashion     { top: 51.5%; left: 16.5%; width: 15.5%; padding-top: 15.5%; }
  .lnk-tools       { top: 49.5%; left: 65.5%; width: 15.5%; padding-top: 15.5%; }
  .lnk-sport       { top: 44.0%; left: 81.0%; width: 15.5%; padding-top: 15.5%; }
  .lnk-exchange    { top: 66.5%; left: 32.5%; width: 14.5%; padding-top: 14.5%; }
  .lnk-free        { top: 64.5%; left: 54.0%; width: 14.5%; padding-top: 14.5%; }

  /* Интерактивные кнопки в шапке сайта */
  .btn-add         { top: 1.5%;  left: 51.0%; width: 17.5%; height: 5.5%; border-radius: 20px; }
  .btn-login       { top: 1.5%;  left: 77.5%; width: 11.5%; height: 5.5%; border-radius: 20px; }
  .btn-cart        { top: 1.5%;  left: 70.0%; width: 6.0%;  height: 5.5%; border-radius: 50%; }
</style>
</head>
<body>

<div class="site-container">
  <!-- Наш золотой слепок. Ссылка ведет на чистый оптимизированный Jpeg вашего скриншота -->
  <img class="bg-screenshot" src="https://screenshotone.com" alt="ΔΕΖΩ Главная">

  <!-- Сетка невидимых кнопок, которые превращают картинку в живой сайт -->
  <a class="interactive-link lnk-electronics" title="Электроника"></a>
  <a class="interactive-link lnk-home"        title="Товары для дома и сада"></a>
  <a class="interactive-link lnk-clothes"     title="Одежда и Обувь"></a>
  <a class="interactive-link lnk-kids"        title="Всё для детей"></a>
  <a class="interactive-link lnk-books"       title="Книги и Игры"></a>
  <a class="interactive-link lnk-appliances"  title="Бытовая техника"></a>
  <a class="interactive-link lnk-tools"       title="Инструменты"></a>
  <a class="interactive-link lnk-sport"       title="Спорт и Хобби"></a>
  
  <!-- Кнопка МОДА И СТИЛЬ (Привязываем к нашей будущей второй странице) -->
  <a class="interactive-link lnk-fashion"     title="Мода и стиль" onclick="window.location.href='category.html'"></a>
  
  <!-- Особые категории (Желтые кружки) -->
  <a class="interactive-link lnk-exchange"    title="Обмен"></a>
  <a class="interactive-link lnk-free"        title="Отдам даром"></a>

  <!-- Функциональные кнопки шапки -->
  <a class="interactive-link btn-add"         title="Добавить объявление"></a>
  <a class="interactive-link btn-login"       title="Войти"></a>
  <a class="interactive-link btn-cart"        title="Корзина"></a>
</div>

</body>
</html>

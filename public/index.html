<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΔΕΖΩ.gr Μια ΔΕύτερη ΖΩή για τα πράγματά σας</title>
<style>
:root { --primary: #00a046; --vip: #ff6b00; --bg: #f5f5f5; --card: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #222; }
header { background: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 4px rgba(0,0,0,.1); position: sticky; top: 0; z-index: 100; }
.logo { font-size: 28px; font-weight: 800; color: var(--primary); cursor: pointer; }
.logo span { font-size: 12px; display: block; font-weight: 400; color: #666; }
.search { flex: 1; margin: 0 20px; display: flex; }
.search input { flex: 1; padding: 10px 16px; border: 2px solid #ddd; border-radius: 24px 0 0 24px; outline: none; }
.search button { background: var(--primary); color: #fff; border: none; padding: 0 20px; border-radius: 0 24px 24px 0; cursor: pointer; }
.lang { cursor: pointer; font-weight: 600; color: #555; }
nav { background: #fff; padding: 10px 20px; display: flex; gap: 12px; overflow-x: auto; border-bottom: 1px solid #eee; }
.cat-btn { padding: 8px 16px; background: #f0f0f0; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.cat-btn.active { background: var(--primary); color: #fff; }
.container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
.ads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.ad-card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); cursor: pointer; position: relative; }
.ad-card img { width: 100%; height: 180px; object-fit: contain; background: #fafafa; }
.ad-card .info { padding: 12px; }
.ad-card .price { font-weight: 700; color: var(--primary); font-size: 18px; }
.badge { position: absolute; top: 8px; left: 8px; background: var(--vip); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.badge.new { background: #2196f3; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; }
.modal.open { display: flex; }
.modal-content { background: #fff; padding: 24px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; margin-bottom: 4px; font-weight: 500; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
button.primary { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
.hidden { display: none; }
.phone { cursor: pointer; color: var(--primary); text-decoration: underline; }
.chat-box { border: 1px solid #eee; border-radius: 8px; height: 300px; overflow-y: auto; padding: 12px; margin: 12px 0; background: #fafafa; }
.msg { margin: 8px 0; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
.msg.me { background: #dcf8c6; margin-left: auto; }
.msg.them { background: #fff; border: 1px solid #eee; }

/* Умный контейнер для размытия фона вертикальных изображений */
.blur-img-container {
  position: relative;
  width: 100%;
  height: 350px;
  border-radius: 8px;
  margin-bottom: 12px;
  overflow: hidden;
  background: #000;
}
.blur-bg {
  position: absolute;
  inset: -10px;
  background-size: cover;
  background-position: center;
  filter: blur(15px);
  opacity: 0.6;
  z-index: 1;
}
.main-img {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 2;
}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="showHome()">ΔΕΖΩ.gr<span id="tagline">Μια ΔΕύτερη ΖΩή για τα πράγματά σας</span></div>
  <div class="search">
    <input id="searchInput" placeholder="Αναζήτηση..." onkeypress="if(event.key==='Enter') searchAds()">
    <button onclick="searchAds()">🔍</button>
  </div>
  <div>
    <span class="lang" onclick="toggleLang()" id="langToggle">EN</span>
    <span id="userMenu" style="margin-left:16px; cursor:pointer;" onclick="showLogin()">Σύνδεση</span>
    <button id="addBtn" class="hidden" onclick="showPostAd()" style="margin-left:12px; background:var(--primary); color:#fff; border:none; padding:8px 16px; border-radius:20px; cursor:pointer;">+ Προσθήκη</button>
  </div>
</header>

<nav id="categories">
  <div class="cat-btn active" onclick="loadAds()">Όλα</div>
  <div class="cat-btn" data-id="kids" onclick="loadAds('kids')">Παιδικός κόσμος</div>
  <div class="cat-btn" data-id="furniture" onclick="loadAds('furniture')">Έπιπλα & Διακόσμηση</div>
  <div class="cat-btn" data-id="clothes" onclick="loadAds('clothes')">Ρούχα & Παπούτσια</div>
  <div class="cat-btn" data-id="fashion" onclick="loadAds('fashion')">Μόδα & Αξεσουάρ</div>
  <div class="cat-btn" data-id="electronics" onclick="loadAds('electronics')">Ηλεκτρονικά</div>
  <div class="cat-btn" data-id="tools" onclick="loadAds('tools')">Εργαλεία</div>
  <div class="cat-btn" data-id="home" onclick="loadAds('home')">Σπίτι & Κήπος</div>
  <div class="cat-btn" data-id="free" onclick="loadAds('free')">Ανταλλαγή / Χάρισμα</div>
  <div class="cat-btn" data-id="other" onclick="loadAds('other')">Διάφορα</div>
</nav>

<div class="container" id="mainContent"></div>

<!-- Modals -->
<div class="modal" id="loginModal">
  <div class="modal-content">
    <h2 id="loginTitle">Σύνδεση</h2>
    <div class="form-group"><input id="loginEmail" type="email" placeholder="Email"></div>
    <div class="form-group"><input id="loginPass" type="password" placeholder="Κωδικός"></div>
    <button class="primary" onclick="login()">Σύνδεση</button>
    <p style="margin-top:12px; text-align:center; cursor:pointer; color:var(--primary);" onclick="showRegister()">Δεν έχεις λογαριασμό; Εγγραφή</p>
  </div>
</div>
<div class="modal" id="registerModal">
  <div class="modal-content">
    <h2>Εγγραφή</h2>
    <div class="form-group"><input id="regName" placeholder="Όνομα"></div>
    <div class="form-group"><input id="regEmail" type="email" placeholder="Email"></div>
    <div class="form-group"><input id="regPhone" placeholder="Τηλέφωνο"></div>
    <div class="form-group"><input id="regPass" type="password" placeholder="Κωδικός (min 6)"></div>
    <button class="primary" onclick="register()">Εγγραφή</button>
    <p style="margin-top:12px; text-align:center; cursor:pointer; color:var(--primary);" onclick="showLogin()">Έχεις ήδη λογαριασμό;</p>
  </div>
</div>
<div class="modal" id="postModal">
  <div class="modal-content">
    <h2>Νέα αγγελία</h2>
    <div class="form-group"><input id="adTitle" placeholder="Τίτλος"></div>
    <div class="form-group"><select id="adCat"></select></div>
    <div class="form-group"><input id="adPrice" type="number" placeholder="Τιμή (€)"></div>
    <div class="form-group"><input id="adCity" placeholder="Πόλη" value="Αθήνα"></div>
    <div class="form-group"><textarea id="adDesc" placeholder="Περιγραφή" rows="4"></textarea></div>
    <div class="form-group"><input type="file" id="adPhoto" accept="image/*"></div>
    <button class="primary" onclick="postAd()">Δημοσίευση</button>
  </div>
</div>
<div class="modal" id="adModal">
  <div class="modal-content" id="adDetail"></div>
</div>

<script>
const API = '';
let lang = 'el';
let token = localStorage.getItem('dezo_token');
let currentUser = JSON.parse(localStorage.getItem('dezo_user') || 'null');
let currentAds = [];

const t = {
  el: {
    tagline: 'Μια Δεύτερη Ζωή για τα πράγματά σας',
    search: 'Αναζήτηση...',
    login: 'Σύνδεση',
    logout: 'Αποσύνδεση',
    add: '+ Προσθήκη',
    vip: 'VIP',
    new: 'Νέο',
    price: 'Τιμή',
    phone: 'Τηλέφωνο',
    reveal: 'Πατήστε για να δείτε',
    message: 'Μήνυμα',
    send: 'Αποστολή',
    promote: 'Προώθηση (VIP)',
    myads: 'Οι αγγελίες μου'
  },
  en: {
    tagline: 'A Second Life for your things',
    search: 'Search...',
    login: 'Login',
    logout: 'Logout',
    add: '+ Post Ad',
    vip: 'VIP',
    new: 'New',
    price: 'Price',
    phone: 'Phone',
    reveal: 'Click to reveal',
    message: 'Message',
    send: 'Send',
    promote: 'Promote (VIP)',
    myads: 'My Ads'
  }
};

function tr(key) { return t[lang][key] || key; }

function toggleLang() {
  lang = lang === 'el' ? 'en' : 'el';
  document.getElementById('langToggle').textContent = lang === 'el' ? 'EN' : 'ΕΛ';
  document.getElementById('tagline').textContent = tr('tagline');
  document.getElementById('searchInput').placeholder = tr('search');
  updateUserMenu();
  
  document.querySelectorAll('#categories .cat-btn').forEach(btn => {
    const id = btn.getAttribute('data-id');
    if (id) {
      const catData = dezoCategories.find(c => c.id === id);
      if (catData) btn.textContent = lang === 'el' ? catData.el : catData.en;
    } else {
      btn.textContent = lang === 'el' ? 'Όλα' : 'All';
    }
  });

  loadCategories();
  showHome();
}

function updateUserMenu() {
  const menu = document.getElementById('userMenu');
  const addBtn = document.getElementById('addBtn');
  if (currentUser) {
    menu.textContent = currentUser.name || tr('logout');
    menu.onclick = logout;
    addBtn.classList.remove('hidden');
    addBtn.textContent = tr('add');
  } else {
    menu.textContent = tr('login');
    menu.onclick = showLogin;
    addBtn.classList.add('hidden');
  }
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

const dezoCategories = [
  { id: "kids", el: "Παιδικός κόσμος", en: "Children's world", subs: { el: ["Παιδιά είδη και ρούχα","Καροτσάκια και καθίσματα", "Παιχνίδια", "Άλλο"], en: ["Children's clothes", "Strollers & Car seats", "Toys", "Other"] } },
{ id: "furniture", el: "Έπιπλα & Διακόσμηση", en: "Furniture & Decor", subs: { el: ["Έπιπλα κουζίνας", "Καναπέδες & Πολυθρόνες", "Ντουλάπες & Τραπέζια", "Άλλο"], en: ["Kitchen furniture", "Sofas & Armchairs", "Wardrobes & Tables", "Other"] } },
{ id: "clothes", el: "Ρούχα & Παπούτσια", en: "Clothes & Shoes", subs: { el: ["Ανδρικά", "Γυναικεία", "Άλλο"], en: ["Men's wardrobe", "Women's wardrobe", "Other"] } },
{ id: "fashion", el: "Μόδα & Αξεσουάρ", en: "Fashion & Accessories", subs: { el: ["Τσάντες & Πορτοφόλια", "Κοσμήματα & Μπιζού", "Καπέλα", "Άλλο"], en: ["Bags & Wallets", "Jewelry", "Hats", "Other"] } },
{ id: "electronics", el: "Ηλεκτρονικά", en: "Electronics", subs: { el: ["Smartphones & Gadgets", "Μεγάλες οικιακές συσκευές", "Μικροσυσκευές", "Τηλεοράσεις & Ήχος", "Άλλο"], en: ["Smartphones & Gadgets", "Large home appliances", "Small appliances", "TV & Audio", "Other"] } },
{ id: "tools", el: "Εργαλεία", en: "Tools", subs: { el: ["Ηλεκτρικά εργαλεία", "Εργαλεία χειρός", "Άλλο"], en: ["Power tools", "Hand tools", "Other"] } },
{ id: "home", el: "Σπίτι & Κήπος", en: "Home & Garden", subs: { el: ["Είδη κουζίνας & Πιάτα", "Εργαλεία κήπου", "Λευκά είδη & Υφάσματα", "Άλλο"], en: ["Kitchenware", "Garden tools", "Home textiles", "Other"] } },
{ id: "free", el: "Ανταλλαγή / Χάρισμα", en: "Exchange / Free", subs: { el: ["Άλλο"], en: ["Other"] } },
{ id: "other", el: "Διάφορα", en: "Other", subs: { el: ["Άλλο"], en: ["Other"] } }
];
function loadCategories() {
const mainSel = document.getElementById('adCat');
if (mainSel) {
mainSel.innerHTML = dezoCategories.map(c => <option value="${c.id}">${lang==='el' ? c.el : c.en}</option>).join('');
let subSel = document.getElementById('adSubCat');
if (!subSel) {
const subGroup = document.createElement('div');
subGroup.className = 'form-group';
subGroup.innerHTML = <select id="adSubCat"></select>;
mainSel.parentNode.insertAdjacentElement('afterend', subGroup);
subSel = document.getElementById('adSubCat');
}
mainSel.onchange = () => updateSubDropdown(mainSel.value);
updateSubDropdown(mainSel.value);
}
}
function updateSubDropdown(catId) {
const subSel = document.getElementById('adSubCat');
if (!subSel) return;
const targetCat = dezoCategories.find(c => c.id === catId);
if (targetCat) {
const list = lang === 'el' ? targetCat.subs.el : targetCat.subs.en;
subSel.innerHTML = list.map(sub => <option value="${sub}">${sub}</option>).join('');
}
}
async function loadAds(category) {
document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
if (category) document.querySelector([data-id="${category}"])?.classList.add('active');
else document.querySelector('.cat-btn')?.classList.add('active');
const q = document.getElementById('searchInput').value;
const params = new URLSearchParams();
if (category) params.set('category', category);
if (q) params.set('q', q);
try {
currentAds = await api('/api/ads?' + params);
renderAds(currentAds);
} catch (e) {
console.error("Ошибка загрузки объявлений:", e);
}
}
function renderAds(list) {
const main = document.getElementById('mainContent');
if (!list || !list.length) { main.innerHTML = 'Δεν βρέθηκαν αγγελίες'; return; }
main.innerHTML = <div class="ads-grid">${list.map(ad => { const imgUrl = ad.photos && ad.photos[0] ? ad.photos[0] : 'https://placeholder.com'; return 

${ad.vip ? <div class="badge">${tr('vip')}</div> : ''}
${Date.now() - ad.created < 86400000 ? <div class="badge new" style="left:auto;right:8px;">${tr('new')}</div> : ''}


${ad.title}
${ad.price} €
${ad.city}

; }).join('')}</div>;
}
function showHome() { loadAds(); }
function searchAds() { loadAds(); }
async function revealPhone(id, el) {
try {
const data = await api('/api/ads/' + id + '/phone');
if (data && data.phone) {
el.textContent = data.phone;
el.style.textDecoration = 'none';
el.onclick = null;
} else {
alert(lang === 'el' ? 'Δεν βρέθηκε τηλέφωνο' : 'Phone not found');
}
} catch (err) {
alert(lang === 'el' ? 'Πρέπει να συνδεθείτε' : 'You must be logged in');
}
}
async function showAd(id) {
try {
const ad = await api('/api/ads/' + id);
const detail = document.getElementById('adDetail');
if (!detail) return;
const isOwner = currentUser && currentUser.id === ad.userId;
const imgUrl = ad.photos && ad.photos[0] ? ad.photos[0] : 'https://placeholder.com';
const displayPhone = ad.phone ? (ad.phoneVisible ? ad.phone : ad.phone.slice(0, 4) + '') : '';
detail.innerHTML = `

${ad.title}
×
${ad.price} €
${ad.city}
${ad.description || ''}
${tr('phone')}:
${displayPhone}
${currentUser && !isOwner ? <h3>${tr('message')}</h3> <div class="chat-box" id="chatBox"></div> <div style="display:flex; gap:8px;"> <input id="msgInput" placeholder="${tr('message')}..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px;"> <button class="primary" style="width:auto;" onclick="sendMessage('${ad.id}', '${ad.userId}')">${tr('send')}</button> </div> : ''}

\;
document.getElementById('adModal').classList.add('open');
if (currentUser && !isOwner) loadMessages(ad.id);
} catch (err) {
alert('Σφάλμα φόρτωσης αγγελίας');
}
}
async function promoteAd(id) {
await api('/api/ads/' + id + '/promote', { method: 'POST' });
alert(lang==='el' ? 'Προωθήθηκε ως VIP!' : 'Promoted to VIP!');
closeModal('adModal');
showHome();
}
async function loadMessages(adId) {
const msgs = await api('/api/messages/' + adId);
const box = document.getElementById('chatBox');
box.innerHTML = msgs.map(m => <div class="msg ${m.from === currentUser.id ? 'me' : 'them'}">${m.text}</div>).join('');
box.scrollTop = box.scrollHeight;
}
async function sendMessage(adId, toUserId) {
const input = document.getElementById('msgInput');
const text = input.value.trim();
if (!text) return;
await api('/api/messages', { method: 'POST', body: JSON.stringify({ adId, text, toUserId }) });
input.value = '';
loadMessages(adId);
}
function showLogin() { document.getElementById('loginModal').classList.add('open'); document.getElementById('registerModal').classList.remove('open'); }
function showRegister() { document.getElementById('registerModal').classList.add('open'); document.getElementById('loginModal').classList.remove('open'); }
function showPostAd() { if (!currentUser) return showLogin(); document.getElementById('postModal').classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
async function login() {
try {
const data = await api('/api/login', { method: 'POST', body: JSON.stringify({
email: document.getElementById('loginEmail').value,
password: document.getElementById('loginPass').value
})});
token = data.token; currentUser = data.user;
localStorage.setItem('dezo_token', token);
localStorage.setItem('dezo_user', JSON.stringify(currentUser));
closeModal('loginModal');
updateUserMenu();
showHome();
} catch { alert('Σφάλμα σύνδεσης'); }
}
async function register() {
try {
const data = await api('/api/register', { method: 'POST', body: JSON.stringify({
name: document.getElementById('regName').value,
email: document.getElementById('regEmail').value,
phone: document.getElementById('regPhone').value,
password: document.getElementById('regPass').value
})});
token = data.token; currentUser = data.user;
localStorage.setItem('dezo_token', token);
localStorage.setItem('dezo_user', JSON.stringify(currentUser));
closeModal('registerModal');
updateUserMenu();
showHome();
} catch { alert('Σφάλμα εγγραφής'); }
}
function logout() {
token = null; currentUser = null;
localStorage.removeItem('dezo_token');
localStorage.removeItem('dezo_user');
updateUserMenu();
showHome();
}
async function postAd() {
try {
const fileInput = document.getElementById('adPhoto');
let photoUrl = '';
if (fileInput && fileInput.files && fileInput.files[0]) {
const form = new FormData();
form.append('photo', fileInput.files[0]);
const res = await fetch('/api/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: form });
if (res.ok) {
const data = await res.json();
photoUrl = data.url;
}
}
const subCatSelect = document.getElementById('adSubCat');
const subCategoryValue = subCatSelect ? subCatSelect.value : 'Άλλο';
await api('/api/ads', { method: 'POST', body: JSON.stringify({
title: document.getElementById('adTitle').value,
category: document.getElementById('adCat').value,
subcategory: subCategoryValue,
price: document.getElementById('adPrice').value,
city: document.getElementById('adCity').value,
description: document.getElementById('adDesc').value,
photos: photoUrl ? [photoUrl] : []
})});
closeModal('postModal');
alert(lang==='el' ? 'Αγγελία δημοσιεύτηκε!' : 'Ad published!');
showHome();
} catch (e) {
alert('Σφάλμα δημοσίευσης αγγελίας');
}
}
// Init
updateUserMenu();
loadCategories();
showHome();
</script>
</body>
</html>
